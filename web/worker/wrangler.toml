name = "btc-craps-oi"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Once a minute after deploy. Locally, `npm run oi:dev` (from web/) starts
# Wrangler and requests /cdn-cgi/local/scheduled on the same schedule.
# The free key is read from worker/.dev.vars.
[triggers]
crons = ["* * * * *"]

[[kv_namespaces]]
binding = "OI_SNAPSHOT"
id = "oi_snapshot_local"

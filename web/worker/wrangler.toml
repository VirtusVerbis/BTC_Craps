name = "btc-craps-oi"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Once a minute. Cloudflare runs this only after deploy.
# Local cron does not tick. From web/:
#   npm run oi:dev
#   curl "http://localhost:8787/cdn-cgi/local/scheduled?cron=*+*+*+*+*"
[triggers]
crons = ["* * * * *"]

[[kv_namespaces]]
binding = "OI_SNAPSHOT"
id = "oi_snapshot_local"
